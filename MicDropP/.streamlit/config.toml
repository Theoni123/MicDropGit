# Streamlit Configuration
# This file configures Streamlit settings for deployment

[server]
# Maximum upload size (in MB) - adjust based on your needs
maxUploadSize = 200

# Maximum message size (in MB)
maxMessageSize = 200

# Enable CORS for cross-origin requests
enableCORS = true

# Enable XSRF protection
enableXsrfProtection = true

[browser]
# Automatically open browser on startup (disabled for cloud)
gatherUsageStats = false

[theme]
# Align with app.py light UI — widgets (file uploader, inputs, etc.) use these tokens;
# a dark theme here caused the upload dropzone and other controls to stay purple while the page looked light.
primaryColor = "#5b8fc7"
backgroundColor = "#f5f8fc"
secondaryBackgroundColor = "#e8f2fb"
textColor = "#111111"
font = "Inter"
